  <script>
    (function () {
      document.addEventListener('copy', function (e) { e.preventDefault(); });
      document.addEventListener('cut', function (e) { e.preventDefault(); });
      document.addEventListener('paste', function (e) { e.preventDefault(); });

      var R2_BASE = 'https://pub-eaf6b9a861824b82ad140f60615e8933.r2.dev';
      var MAX_SEC = 60;

      var LANGS = [
        { code: 'hi', label: 'हिन्दी', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'पब्लिश करें', send: 'भेजें' },
        { code: 'en', label: 'English', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'Publish', send: 'Send' },
        { code: 'bn', label: 'বাংলা', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'পাবলিশ করুন', send: 'পাঠান' },
        { code: 'mr', label: 'मराठी', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'प्रकाशित करा', send: 'पाठवा' },
        { code: 'te', label: 'తెలుగు', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'ప్రచురించండి', send: 'పంపండి' },
        { code: 'ta', label: 'தமிழ்', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'வெளியிடு', send: 'அனுப்பு' },
        { code: 'gu', label: 'ગુજરાતી', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'પ્રકાશિત કરો', send: 'મોકલો' },
        { code: 'kn', label: 'ಕನ್ನಡ', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'ಪ್ರಕಟಿಸಿ', send: 'ಕಳುಹಿಸಿ' },
        { code: 'ml', label: 'മലയാളം', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'പ്രസിദ്ധീകരിക്കുക', send: 'അയയ്ക്കുക' },
        { code: 'pa', label: 'ਪੰਜਾਬੀ', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'ਪ੍ਰਕਾਸ਼ਿਤ ਕਰੋ', send: 'ਭੇਜੋ' },
        { code: 'or', label: 'ଓଡ଼ିଆ', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'ପ୍ରକାଶ କରନ୍ତୁ', send: 'ପଠାନ୍ତୁ' },
        { code: 'as', label: 'অসমীয়া', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'প্ৰকাশ কৰক', send: 'পঠিয়াওক' },
        { code: 'ur', label: 'اردو', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'شائع کریں', send: 'بھیجیں' },
        { code: 'sd', label: 'سنڌي', feed: 'Feed', stories: 'Stories', create: 'Create', profile: 'Profile', publish: 'شايع ڪريو', send: 'موڪليو' }
      ];

      function getStore(k, defVal) {
        try {
          var v = localStorage.getItem(k);
          return v ? JSON.parse(v) : defVal;
        } catch (e) {
          return defVal;
        }
      }

      function setStore(k, val) {
        try {
          localStorage.setItem(k, JSON.stringify(val));
        } catch (e) {}
      }

      function cleanHandle(str) {
        var s = String(str || '').trim().replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_@]/g, '');
        if (!s) return '@2friend_user';
        return s.charAt(0) === '@' ? s : '@' + s;
      }

      var handle = cleanHandle(getStore('2f_handle', '@2friend_user'));
      var langCode = getStore('2f_lang', 'hi');
      var posts = getStore('2f_posts', [
        { id: 'p1', author: '2friend Tips', tag: 'Max 1m Video', caption: '2friend सिर्फ़ 1-मिनट शॉर्ट-वीडियो ऐप है — बिना कॉपीराइट संगीत, टेक्स्ट-ओनली चैट/कमेंट, और नो-डाउनलोड लॉक सक्रिय है।', videoUrl: '', likes: 0, liked: false, comments: [] }
      ]);
      var stories = getStore('2f_stories', [
        { user: 'आपकी स्टोरी', text: '1-मिनट वीडियो स्टोरी (Copyright-Free Music)', videoUrl: '' },
        { user: '2friend Demo', text: '2friend शॉर्ट वीडियो डेमो', videoUrl: '' },
        { user: 'Gaming Ad · Applooney Max', text: 'गेमिंग विज्ञापन स्लॉट सक्रिय (Rewarded Video Off)', videoUrl: '' }
      ]);
      var msgs = getStore('2f_msgs', ['2friend: स्वागत है! यहाँ केवल टेक्स्ट मैसेज सक्रिय है।']);
      var users = getStore('2f_users', [
        { handle: handle, minutes: 14 },
        { handle: '@friend_one', minutes: 11 },
        { handle: '@friend_two', minutes: 7 }
      ]);

      function applyLang() {
        var item = LANGS[0];
        for (var i = 0; i < LANGS.length; i++) {
          if (LANGS[i].code === langCode) { item = LANGS[i]; break; }
        }
        var badge = document.getElementById('apiSyncBadge');
        if (badge) badge.textContent = '14 Lang · ' + item.label + ' · Max 1m';
        var btns = document.querySelectorAll('nav button');
        if (btns[0]) btns[0].textContent = item.feed;
        if (btns[1]) btns[1].textContent = item.stories;
        if (btns[2]) btns[2].textContent = item.create;
        if (btns[3]) btns[3].textContent = item.profile;
        var pubBtn = document.querySelector('#createView .row .btn');
        if (pubBtn) pubBtn.textContent = item.publish;
        var sndBtn = document.querySelector('#profileView .row .btn');
        if (sndBtn) sndBtn.textContent = item.send;
      }

      function initLangSelect() {
        var wrap = document.querySelector('header .brand-wrap');
        if (!wrap || document.getElementById('langSel')) return;
        var sel = document.createElement('select');
        sel.id = 'langSel';
        sel.style.cssText = 'width:auto;padding:4px 8px;font-size:12px;border-radius:999px;background:#1a1a1a;color:#2ecc71;border:1px solid #2ecc71;';
        for (var i = 0; i < LANGS.length; i++) {
          var opt = document.createElement('option');
          opt.value = LANGS[i].code;
          opt.textContent = LANGS[i].label;
          if (LANGS[i].code === langCode) opt.selected = true;
          sel.appendChild(opt);
        }
        sel.onchange = function () {
          langCode = sel.value;
          setStore('2f_lang', langCode);
          applyLang();
        };
        wrap.appendChild(sel);
      }

      function initHandleBox() {
        var pCard = document.querySelector('#profileView .card');
        if (!pCard || document.getElementById('handleBox')) return;
        var row = document.createElement('div');
        row.id = 'handleBox';
        row.className = 'row';
        row.innerHTML = '<input id="hInput" type="text" placeholder="@username" /><button class="btn" id="hSave" type="button">हैंडल सेव</button>';
        pCard.appendChild(row);
        document.getElementById('hInput').value = handle;
        document.getElementById('hSave').onclick = function () {
          handle = cleanHandle(document.getElementById('hInput').value);
          setStore('2f_handle', handle);
          syncHandle();
        };
        syncHandle();
      }

      function syncHandle() {
        var h1 = document.querySelector('header > span');
        var h2 = document.querySelector('#profileView .card .card-head strong');
        if (h1) h1.textContent = handle;
        if (h2) h2.textContent = handle;
        if (users[0]) users[0].handle = handle;
        renderUsers();
      }

      window.switchTab = function (btn, viewId) {
        var views = document.querySelectorAll('.view');
        for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
        var v = document.getElementById(viewId);
        if (v) v.classList.add('active');
        var navs = document.querySelectorAll('nav button');
        for (var j = 0; j < navs.length; j++) navs[j].classList.remove('active');
        if (btn) btn.classList.add('active');
      };

      window.adminRemovePost = function (idx) {
        posts.splice(idx, 1);
        setStore('2f_posts', posts);
        renderFeed();
      };

      window.toggleLike = function (idx) {
        posts[idx].liked = !posts[idx].liked;
        posts[idx].likes += posts[idx].liked ? 1 : -1;
        setStore('2f_posts', posts);
        renderFeed();
      };

      window.toggleComments = function (idx) {
        var el = document.getElementById('cbox-' + idx);
        if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
      };

      window.addComment = function (idx) {
        var inp = document.getElementById('cinp-' + idx);
        if (!inp || !inp.value.trim()) return;
        posts[idx].comments.push(handle + ': ' + inp.value.trim());
        setStore('2f_posts', posts);
        renderFeed();
        var el = document.getElementById('cbox-' + idx);
        if (el) el.style.display = 'block';
      };

      window.sharePost = function () {
        alert('2friend लिंक तैयार है।');
      };

      function renderFeed() {
        var box = document.getElementById('feedList');
        if (!box) return;
        box.innerHTML = '';
        for (var i = 0; i < posts.length; i++) {
          var p = posts[i];
          var art = document.createElement('article');
          art.className = 'card';
          var vidHtml = p.videoUrl
            ? '<div class="preview"><video src="' + p.videoUrl + '" controls playsinline preload="metadata" controlsList="nodownload noplaybackrate" disablePictureInPicture></video></div>'
            : '<div class="preview" style="color:#aaa;font-size:14px;">1-Min Video Preview (Any Quality · Copyright-Free Music)</div>';
          var cList = '';
          for (var c = 0; c < p.comments.length; c++) {
            cList += '<li><span>' + p.comments[c] + '</span></li>';
          }
          art.innerHTML =
            '<div class="card-head"><strong>' + p.author + '</strong>' +
            '<div style="display:flex;gap:6px;align-items:center;"><span class="tag">' + p.tag + '</span>' +
            '<button type="button" class="btn-outline" style="padding:4px 8px;font-size:11px;" onclick="adminRemovePost(' + i + ')">Admin हटाएँ</button></div></div>' +
            '<p style="margin:10px 0 4px;font-size:14px;color:#ddd;">' + p.caption + '</p>' +
            vidHtml +
            '<div class="actions">' +
            '<button class="' + (p.liked ? 'liked' : '') + '" onclick="toggleLike(' + i + ')">Like (' + p.likes + ')</button>' +
            '<button onclick="toggleComments(' + i + ')">Comment (' + p.comments.length + ')</button>' +
            '<button onclick="sharePost()">Share</button></div>' +
            '<div class="comments" id="cbox-' + i + '"><ul class="comment-list">' + cList + '</ul>' +
            '<div class="row"><input id="cinp-' + i + '" type="text" placeholder="टेक्स्ट कमेंट..." /><button class="btn" onclick="addComment(' + i + ')">भेजें</button></div></div>';
          box.appendChild(art);
        }
      }

      window.selectPostKind = function (k) {
        var h = document.getElementById('postKind');
        if (h) h.value = k;
      };

      window.createPost = function () {
        var status = document.getElementById('createStatus');
        var fileInp = document.getElementById('postVideoFile');
        var file = fileInp && fileInp.files ? fileInp.files[0] : null;
        var rawUrl = (document.getElementById('postMediaUrl') || { value: '' }).value.trim();
        var base = (document.getElementById('r2BaseInput') || { value: R2_BASE }).value.trim() || R2_BASE;
        var cap = (document.getElementById('postCaption') || { value: '' }).value.trim() || '2friend 1-मिनट वीडियो';
        var langVal = (document.getElementById('postLanguage') || { value: langCode }).value || langCode;
        var musicVal = (document.getElementById('postMusicTrack') || { value: 'Copyright-Free' }).value;

        function finish(vUrl) {
          posts.unshift({
            id: String(Date.now()),
            author: handle,
            tag: 'Max 1m · ' + langVal.toUpperCase(),
            caption: cap + ' [' + langVal.toUpperCase() + ' • ' + musicVal + ']',
            videoUrl: vUrl,
            likes: 0,
            liked: false,
            comments: []
          });
          setStore('2f_posts', posts);
          if (status) status.textContent = 'वीडियो फ़ीड में जुड़ गया है।';
          renderFeed();
          window.switchTab(document.querySelector('nav button'), 'feedView');
        }

        if (file) {
          var u = URL.createObjectURL(file);
          var v = document.createElement('video');
          v.preload = 'metadata';
          v.onloadedmetadata = function () {
            var dur = v.duration;
            URL.revokeObjectURL(u);
            if (dur > MAX_SEC) {
              if (status) status.textContent = 'सिर्फ़ 1 मिनट (60 सेकंड) तक का वीडियो मान्य है।';
              return;
            }
            finish(URL.createObjectURL(file));
          };
          v.src = u;
          return;
        }

        var finalUrl = '';
        if (rawUrl) {
          finalUrl = /^https?:\/\//i.test(rawUrl) ? rawUrl : base.replace(/\/+$/, '') + '/' + rawUrl.replace(/^\/+/, '');
        }
        finish(finalUrl);
      };

      function renderStories() {
        var hub = document.getElementById('storiesHubList');
        if (!hub) return;
        hub.innerHTML = '';
        for (var i = 0; i < stories.length; i++) {
          var li = document.createElement('li');
          li.innerHTML = '<span><strong>' + stories[i].user + '</strong> — ' + stories[i].text + '</span>';
          hub.appendChild(li);
        }
      }

      window.openDirectStory = function (idx) {
        var m = document.getElementById('storyModal');
        var s = stories[idx] || stories[0];
        if (!m || !s) return;
        document.getElementById('storyUser').textContent = s.user;
        document.getElementById('storyText').textContent = s.text;
        m.classList.add('open');
      };

      window.nextStoryStep = function () {
        window.openDirectStory(1);
      };

      window.closeStory = function () {
        var m = document.getElementById('storyModal');
        if (m) m.classList.remove('open');
      };

      function renderChat() {
        var ul = document.getElementById('chatList');
        if (!ul) return;
        ul.innerHTML = '';
        for (var i = 0; i < msgs.length; i++) {
          var li = document.createElement('li');
          li.innerHTML = '<span>' + msgs[i] + '</span>';
          ul.appendChild(li);
        }
      }

      window.sendChat = function () {
        var inp = document.getElementById('chatInput');
        if (!inp || !inp.value.trim()) return;
        msgs.push(handle + ': ' + inp.value.trim());
        setStore('2f_msgs', msgs);
        inp.value = '';
        renderChat();
      };

      function renderUsers() {
        var ul = document.getElementById('winnerRankList');
        if (!ul) return;
        var copy = users.slice().sort(function (a, b) { return b.minutes - a.minutes; });
        ul.innerHTML = '';
        for (var i = 0; i < copy.length; i++) {
          var li = document.createElement('li');
          li.innerHTML = '<span>#' + (i + 1) + ' ' + copy[i].handle + ' — ' + copy[i].minutes + ' min</span>';
          ul.appendChild(li);
        }
        var pt = document.getElementById('profileScreenTime');
        if (pt && users[0]) pt.textContent = users[0].minutes + ' min';
      }

      window.simulateScreenTime = function () {
        users[0].minutes += 1;
        setStore('2f_users', users);
        renderUsers();
      };

      window.processMidnightPayout = function () {
        var st = document.getElementById('payoutStatus');
        if (st && users[0]) st.textContent = 'रात 12:00 AM रिवॉर्ड तैयार: ' + users[0].handle;
      };

      initLangSelect();
      initHandleBox();
      applyLang();
      renderFeed();
      renderStories();
      renderChat();
      renderUsers();
    })();
  </script>
