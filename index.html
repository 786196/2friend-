  <script>
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());

    const STORAGE_KEYS = {
      posts: '2friend_posts_v1',
      stories: '2friend_stories_v1',
      messages: '2friend_messages_v1',
      screenUsers: '2friend_screen_users_v1',
      deletedIds: '2friend_deleted_ids_v1'
    };

    const R2_CACHE_BASE = 'https://pub-eaf6b9a861824b82ad140f60615e8933.r2.dev';
    const MAX_VIDEO_SECONDS = 60;
    const MAX_VIDEO_HEIGHT = 480;

    const PRIMARY_AD_NETWORK = 'Applooney Max';
    const AD_NETWORK_PRIORITY = [
      'Applooney Max',
      'Google',
      'Unity',
      'Meta',
      'AppLovin',
      'ironSource',
      'Chartboost'
    ];

    let adBreakCounter = 0;
    function getNextAdNetwork() {
      const network = AD_NETWORK_PRIORITY[adBreakCounter % AD_NETWORK_PRIORITY.length];
      adBreakCounter += 1;
      return network;
    }

    function buildCacheSafeR2Url(base, rawPath) {
      if (!rawPath) return '';
      const cleanUrl = rawPath.split('?')[0].trim();
      if (/^https?:\/\//i.test(cleanUrl)) return cleanUrl;
      const cleanBase = (base || R2_CACHE_BASE).replace(/\/+$/, '');
      const cleanPath = cleanUrl.replace(/^\/+/, '');
      return cleanBase ? `${cleanBase}/${cleanPath}` : cleanPath;
    }

    function loadStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function saveStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_) {}
    }

    function setPhoneReadyBadge() {
      const badge = document.getElementById('apiSyncBadge');
      if (!badge) return;
      badge.textContent = 'Phone Storage · Active';
      badge.style.background = '#163826';
      badge.style.color = '#2ecc71';
    }

    function validateVideoFile(file) {
      return new Promise((resolve, reject) => {
        const tempUrl = URL.createObjectURL(file);
        const probe = document.createElement('video');
        probe.preload = 'metadata';

        probe.onloadedmetadata = () => {
          const duration = probe.duration;
          const height = probe.videoHeight || 0;
          URL.revokeObjectURL(tempUrl);

          if (!Number.isFinite(duration) || duration <= 0) {
            reject(new Error('वीडियो की अवधि नहीं पढ़ी जा सकी।'));
            return;
          }
          if (duration > MAX_VIDEO_SECONDS) {
            reject(new Error(`1 मिनट से अधिक का वीडियो मान्य नहीं है (${Math.ceil(duration)} सेकंड)।`));
            return;
          }
          if (height > MAX_VIDEO_HEIGHT) {
            reject(new Error(`केवल 480p या उससे कम रिज़ॉल्यूशन वाला वीडियो मान्य है (वर्तमान: ${height}p)।`));
            return;
          }
          resolve({ duration, height });
        };

        probe.onerror = () => {
          URL.revokeObjectURL(tempUrl);
          reject(new Error('वीडियो फ़ाइल पढ़ी नहीं जा सकी।'));
        };

        probe.src = tempUrl;
      });
    }

    const defaultPosts = [
      {
        id: 'tips',
        author: '2friend Tips',
        tag: 'Text Feed',
        caption: '2friend पर केवल टेक्स्ट कमेंट और मैसेज चलते हैं, वीडियो सीमा अधिकतम 1 मिनट (480p) है, और मीडिया डाउनलोड/कॉपी-पेस्ट लॉक सक्रिय है।',
        imageUrl: '',
        videoUrl: '',
        likes: 0,
        liked: false,
        comments: []
      },
      {
        id: 'photo',
        author: '2friend Photo',
        tag: 'Cloudflare R2 · Image',
        caption: '2friend Feed Photo Preview — डाउनलोड और कॉपी-पेस्ट लॉक सक्रिय।',
        imageUrl: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=60',
        videoUrl: '',
        likes: 0,
        liked: false,
        comments: []
      },
      {
        id: 'official',
        author: '2friend Official',
        tag: 'Cloudflare R2 · 480p · Max 1m',
        caption: 'Short Video / Story Preview (Max 1 min · 480p / H.264 / AAC 128kbps)',
        imageUrl: '',
        videoUrl: '',
        likes: 0,
        liked: false,
        comments: []
      }
    ];

    let deletedIds = loadStorage(STORAGE_KEYS.deletedIds, []);
    let posts = loadStorage(STORAGE_KEYS.posts, defaultPosts).filter(
      p => !deletedIds.includes(String(p.id))
    );

    function renderFeed() {
      const list = document.getElementById('feedList');
      if (!list) return;
      list.innerHTML = '';
      adBreakCounter = 0;

      posts.forEach((post, index) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-head">
            <strong>${post.author}</strong>
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <span class="tag">${post.tag}</span>
              <button type="button" class="btn-outline" style="padding:4px 8px; font-size:11px; border-color:#7f1d1d; color:#fca5a5;" onclick="adminRemovePost(${index})">Admin हटाएँ</button>
            </div>
          </div>
          ${post.caption ? `<p style="margin:10px 0 4px; font-size:14px; color:#ddd; line-height:1.45;">${post.caption}</p>` : ''}
          ${post.imageUrl ? `
            <div class="preview">
              <img class="post-img" src="${post.imageUrl}" alt="${post.author}" loading="lazy" />
            </div>
          ` : ''}
          ${post.videoUrl ? `
            <div class="preview">
              <video src="${post.videoUrl}" controls playsinline preload="metadata" controlsList="nodownload noplaybackrate" disablePictureInPicture></video>
            </div>
          ` : (post.id === 'official' ? `
            <div class="preview" style="color:#aaa; font-size:14px;">
              Short Video / Story Preview (Max 1 min · 480p / H.264 / AAC 128kbps)
            </div>
          ` : '')}
          <div class="actions">
            <button class="${post.liked ? 'liked' : ''}" onclick="toggleLike(${index})">Like (${post.likes})</button>
            <button onclick="toggleComments(${index})">Comment (${post.comments.length})</button>
            <button onclick="sharePost()">Share</button>
          </div>
          <div class="comments" id="comments-${index}">
            <ul class="comment-list">
              ${post.comments.map(c => `<li><span>${c}</span></li>`).join('')}
            </ul>
            <div class="row">
              <input type="text" id="input-${index}" placeholder="टेक्स्ट कमेंट लिखें..." />
              <button class="btn" onclick="addComment(${index})">भेजें</button>
            </div>
          </div>
        `;
        list.appendChild(card);

        if ((index + 1) % 2 === 0) {
          const adNetwork = getNextAdNetwork();
          const isPrimary = adNetwork === PRIMARY_AD_NETWORK;
          const adCard = document.createElement('aside');
          adCard.className = 'ad-card';
          adCard.innerHTML = `
            <div class="card-head">
              <strong>${isPrimary ? 'Main Ad Break · Applooney Max' : `Sponsored Ad Break · ${adNetwork}`}</strong>
              <span class="badge-ad">${adNetwork}</span>
            </div>
            <p style="margin:8px 0 0; font-size:13px; color:#ddd;">
              ${isPrimary
                ? 'Applooney Max मुख्य विज्ञापन स्लॉट सक्रिय — कम डेटा खपत के साथ मोनेटाइज़ेशन।'
                : `${adNetwork} बैकअप विज्ञापन स्लॉट सक्रिय — Applooney Max प्राथमिकता क्रम में।`}
            </p>
          `;
          list.appendChild(adCard);
        }
      });

      document.querySelectorAll('#feedList video').forEach(v => {
        v.muted = false;
        v.volume = 1.0;
      });
    }

    function adminRemovePost(i) {
      const target = posts[i];
      if (!target) return;
      deletedIds.push(String(target.id));
      saveStorage(STORAGE_KEYS.deletedIds, deletedIds);
      posts.splice(i, 1);
      saveStorage(STORAGE_KEYS.posts, posts);
      renderFeed();
    }

    function toggleLike(i) {
      posts[i].liked = !posts[i].liked;
      posts[i].likes += posts[i].liked ? 1 : -1;
      saveStorage(STORAGE_KEYS.posts, posts);
      renderFeed();
    }

    function toggleComments(i) {
      const el = document.getElementById(`comments-${i}`);
      if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function addComment(i) {
      const input = document.getElementById(`input-${i}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;
      posts[i].comments.push(val);
      saveStorage(STORAGE_KEYS.posts, posts);
      renderFeed();
      const el = document.getElementById(`comments-${i}`);
      if (el) el.style.display = 'block';
    }

    const defaultStories = [
      { user: 'आपकी स्टोरी', text: 'आपकी 480p स्टोरी लाइव है (Max 1 Min)।', isAd: false, adNetwork: 'Applooney Max', videoUrl: '' },
      { user: '2friend Demo', text: '2friend पर तेज़ 480p वीडियो और 128k ऑडियो का अनुभव लें।', isAd: false, adNetwork: 'Applooney Max', videoUrl: '' },
      { user: 'Ad Break · Applooney Max', text: 'Applooney Max (Main Ad) → Google → Unity → Meta → AppLovin → ironSource → Chartboost', isAd: true, adNetwork: 'Applooney Max', videoUrl: '' },
      { user: 'दोस्त 1', text: 'दोस्त 1 की शॉर्ट स्टोरी चल रही है।', isAd: false, adNetwork: 'Google', videoUrl: '' },
      { user: 'दोस्त 2', text: 'दोस्त 2 की शॉर्ट स्टोरी चल रही है।', isAd: false, adNetwork: 'Unity', videoUrl: '' },
      { user: 'Ad Break · Google', text: 'Applooney Max (Main Ad) → Google → Unity → Meta → AppLovin → ironSource → Chartboost', isAd: true, adNetwork: 'Google', videoUrl: '' }
    ];

    let storyItems = loadStorage(STORAGE_KEYS.stories, defaultStories);

    function renderStoriesHub() {
      const hub = document.getElementById('storiesHubList');
      if (!hub) return;
      hub.innerHTML = storyItems
        .map((s, idx) => `
          <li>
            <span>${s.isAd ? '⚡ ' : '● '}<strong>${s.user}</strong> — ${s.text}</span>
            <button class="btn-outline" style="padding:5px 10px; font-size:12px;" onclick="openDirectStory(${idx})">खोलें</button>
          </li>
        `)
        .join('');
    }

    let currentStoryIdx = 0;
    let storyTimer = null;
    let progressVal = 0;

    function openDirectStory(idx) {
      currentStoryIdx = Number(idx) || 0;
      const modal = document.getElementById('storyModal');
      if (!modal) return;
      modal.classList.add('open');
      showCurrentStory();
    }

    function showCurrentStory() {
      clearInterval(storyTimer);
      progressVal = 0;
      const item = storyItems[currentStoryIdx] || storyItems[0];

      document.getElementById('storyUser').textContent = item.isAd
        ? `Ad Break · ${item.adNetwork || 'Applooney Max'}`
        : item.user;
      document.getElementById('storyText').textContent = item.text;

      const badge = document.getElementById('storyAdBadge');
      if (item.isAd) {
        badge.style.display = 'inline-block';
        badge.textContent = item.adNetwork === PRIMARY_AD_NETWORK
          ? 'Main Ad · Applooney Max'
          : `Ad Break · ${item.adNetwork}`;
      } else {
        badge.style.display = 'none';
      }

      const mediaSlot = document.getElementById('storyMediaSlot');
      mediaSlot.innerHTML = item.videoUrl
        ? `<video class="story-video" src="${item.videoUrl}" controls playsinline controlsList="nodownload noplaybackrate" disablePictureInPicture></video>`
        : '';

      const fill = document.getElementById('storyProgress');
      fill.style.width = '0%';

      const storyVid = mediaSlot.querySelector('video');
      if (storyVid) {
        storyVid.muted = false;
        storyVid.volume = 1.0;
        document.getElementById('storySub').textContent = 'वीडियो स्टोरी चल रही है (Max 1m · 480p)';
        storyVid.play().catch(() => {});

        storyTimer = setInterval(() => {
          if (storyVid.duration && Number.isFinite(storyVid.duration)) {
            progressVal = Math.min(100, (storyVid.currentTime / storyVid.duration) * 100);
            fill.style.width = progressVal + '%';
          }
        }, 200);

        storyVid.onended = () => nextStoryStep();
        return;
      }

      document.getElementById('storySub').textContent = item.isAd
        ? `Sponsored Break (${item.adNetwork || 'Applooney Max'}) • 5 सेकंड में अगली स्टोरी`
        : '480p · HLS · 128k · Max 1m • डाउनलोड/कॉपी-पेस्ट लॉक सक्रिय';
      document.getElementById('storyBox').style.borderColor = item.isAd ? '#f1c40f' : '#2a2a2a';

      storyTimer = setInterval(() => {
        progressVal += 4;
        fill.style.width = progressVal + '%';
        if (progressVal >= 100) {
          nextStoryStep();
        }
      }, 200);
    }

    function nextStoryStep() {
      currentStoryIdx = (currentStoryIdx + 1) % storyItems.length;
      showCurrentStory();
    }

    function closeStory() {
      clearInterval(storyTimer);
      const mediaSlot = document.getElementById('storyMediaSlot');
      if (mediaSlot) mediaSlot.innerHTML = '';
      const modal = document.getElementById('storyModal');
      if (modal) modal.classList.remove('open');
    }

    function selectPostKind(kind) {
      const hiddenInput = document.getElementById('postKind');
      const feedBtn = document.getElementById('btnKindFeed');
      const storyBtn = document.getElementById('btnKindStory');
      if (hiddenInput) hiddenInput.value = kind;
      if (feedBtn && storyBtn) {
        feedBtn.className = kind === 'feed' ? 'btn' : 'btn-outline';
        storyBtn.className = kind === 'story' ? 'btn' : 'btn-outline';
      }
    }

    async function createPost() {
      const kind = document.getElementById('postKind').value;
      const author = document.getElementById('postTitle').value.trim() || '@2friend_user';
      const language = document.getElementById('postLanguage').value || 'hi';
      const musicTrack = document.getElementById('postMusicTrack').value || '2friend Beat 01 (Copyright-Free)';
      const r2Base = document.getElementById('r2BaseInput').value.trim() || R2_CACHE_BASE;
      const rawMedia = document.getElementById('postMediaUrl').value.trim();
      const fileInput = document.getElementById('postVideoFile');
      const selectedFile = fileInput && fileInput.files ? fileInput.files[0] : null;
      const rawCaption = document.getElementById('postCaption').value.trim() || '2friend पोस्ट';
      const caption = `${rawCaption} [${language.toUpperCase()} • ${musicTrack}]`;
      const status = document.getElementById('createStatus');

      let localVideoUrl = '';
      let durationSec = 0;

      if (selectedFile) {
        try {
          const meta = await validateVideoFile(selectedFile);
          durationSec = Math.round(meta.duration);
          localVideoUrl = URL.createObjectURL(selectedFile);
          status.textContent = `वीडियो मान्य है (${durationSec}s / Max 60s, ${meta.height}p / Max 480p)।`;
        } catch (err) {
          status.textContent = err.message;
          if (fileInput) fileInput.value = '';
          return;
        }
      }

      const r2MediaUrl = buildCacheSafeR2Url(r2Base, rawMedia);
      const mediaUrl = localVideoUrl || r2MediaUrl;

      if (kind === 'story') {
        storyItems.splice(1, 0, {
          user: author,
          text: caption,
          isAd: false,
          adNetwork: 'Applooney Max',
          videoUrl: mediaUrl
        });
        saveStorage(STORAGE_KEYS.stories, storyItems);
        renderStoriesHub();

        if (fileInput) fileInput.value = '';
        document.getElementById('postTitle').value = '';
        document.getElementById('postMediaUrl').value = '';
        document.getElementById('postCaption').value = '';
        status.textContent = 'नई स्टोरी फ़ोन में सेव हो गई है — Stories खुल रही है...';

        const storiesBtn = document.querySelectorAll('nav button')[1];
        if (storiesBtn) switchTab(storiesBtn, 'storiesView');
        openDirectStory(1);
        return;
      }

      const isVideo = Boolean(localVideoUrl) || /\.(mp4|m3u8|webm)$/i.test(mediaUrl);
      posts.unshift({
        id: Date.now(),
        author,
        tag: r2MediaUrl
          ? (isVideo ? `Cloudflare R2 · 480p · ${language.toUpperCase()}` : `Cloudflare R2 · Image · ${language.toUpperCase()}`)
          : (isVideo ? `Video · Max 1m · 480p · ${language.toUpperCase()}` : `Text Feed · ${language.toUpperCase()}`),
        caption: isVideo ? `${caption} (Max 1 min · 480p / 128kbps)` : caption,
        imageUrl: mediaUrl && !isVideo ? mediaUrl : '',
        videoUrl: mediaUrl && isVideo ? mediaUrl : '',
        likes: 0,
        liked: false,
        comments: []
      });
      saveStorage(STORAGE_KEYS.posts, posts);

      if (fileInput) fileInput.value = '';
      document.getElementById('postTitle').value = '';
      document.getElementById('postMediaUrl').value = '';
      document.getElementById('postCaption').value = '';
      status.textContent = 'पोस्ट फ़ोन में सेव होकर Feed में जुड़ गई है।';

      renderFeed();
      switchTab(document.querySelector('nav button'), 'feedView');
    }

    const defaultMessages = [
      '2friend: स्वागत है! यहाँ केवल टेक्स्ट मैसेज सक्रिय है।'
    ];
    let savedMessages = loadStorage(STORAGE_KEYS.messages, defaultMessages);

    function renderChat() {
      const list = document.getElementById('chatList');
      if (!list) return;
      list.innerHTML = savedMessages
        .map(m => `<li><span>${m}</span></li>`)
        .join('');
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      savedMessages.push(`आप: ${msg}`);
      saveStorage(STORAGE_KEYS.messages, savedMessages);
      renderChat();
      input.value = '';
    }

    function sharePost() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).catch(() => {});
      }
      alert('2friend लिंक तैयार है।');
    }

    function switchTab(btn, viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    const defaultScreenUsers = [
      { handle: '@2friend_user', minutes: 14 },
      { handle: '@friend_one', minutes: 11 },
      { handle: '@friend_two', minutes: 7 }
    ];
    let screenUsers = loadStorage(STORAGE_KEYS.screenUsers, defaultScreenUsers);

    function renderWinners() {
      const list = document.getElementById('winnerRankList');
      if (!list) return;
      const sorted = [...screenUsers].sort((a, b) => b.minutes - a.minutes);
      list.innerHTML = sorted
        .map((u, idx) => `<li><span>#${idx + 1} ${u.handle} — ${u.minutes} min</span></li>`)
        .join('');
      const currentUser = screenUsers.find(u => u.handle === '@2friend_user') || sorted[0];
      const profileTime = document.getElementById('profileScreenTime');
      if (profileTime && currentUser) profileTime.textContent = `${currentUser.minutes} min`;
    }

    function simulateScreenTime() {
      screenUsers[0].minutes += 1;
      saveStorage(STORAGE_KEYS.screenUsers, screenUsers);
      renderWinners();
    }

    function processMidnightPayout() {
      const status = document.getElementById('payoutStatus');
      const rewardState = document.getElementById('profileRewardState');
      const top = [...screenUsers].sort((a, b) => b.minutes - a.minutes)[0];
      if (status && top) {
        status.textContent = `रात 12:00 AM प्रोसेस पूरा: टॉप विनर ${top.handle} (${top.minutes} min)`;
      }
      if (rewardState && top) {
        rewardState.textContent = `Winner: ${top.handle}`;
      }
    }

    setPhoneReadyBadge();
    renderFeed();
    renderStoriesHub();
    renderChat();
    renderWinners();
  </script>
