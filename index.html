<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2friend</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #ffffff;
      padding-bottom: 78px;
    }
    header {
      position: sticky;
      top: 0;
      background: #181818;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo { font-size: 20px; font-weight: 700; }
    .badge {
      font-size: 11px;
      background: #223824;
      color: #7ee081;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #355e38;
    }
    .stories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 12px 16px;
      border-bottom: 1px solid #242424;
    }
    .story {
      min-width: 72px;
      text-align: center;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2c2c2c;
      border: 2px solid #4caf50;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
    }
    .story-viewer {
      margin: 12px 16px 0;
      background: #1c1c1c;
      border: 1px solid #2f4b32;
      border-radius: 12px;
      padding: 12px;
      display: none;
    }
    .story-viewer.open { display: block; }
    .story-viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .tab-section {
      display: none;
      padding: 14px 16px;
      flex-direction: column;
      gap: 14px;
    }
    .tab-section.active { display: flex; }
    .card {
      background: #1c1c1c;
      border: 1px solid #2b2b2b;
      border-radius: 12px;
      padding: 14px;
    }
    .card-header {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .sub-tag {
      font-size: 11px;
      color: #8ab4f8;
      background: #1e2938;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .media-box {
      min-height: 220px;
      background: #222;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      color: #aaa;
      margin: 8px 0 10px;
      overflow: hidden;
      position: relative;
    }
    video {
      width: 100%;
      max-height: 360px;
      display: block;
      background: #000;
    }
    .actions {
      display: flex;
      gap: 16px;
      font-size: 14px;
      color: #bbb;
      align-items: center;
    }
    .action-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 14px;
      padding: 4px 0;
      cursor: pointer;
    }
    .action-btn.liked { color: #ff5252; font-weight: 600; }
    .delete-btn {
      background: none;
      border: 1px solid #4a2626;
      color: #ff7b7b;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .comment-box {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }
    .comment-box.open { display: block; }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ddd;
    }
    .comment-item {
      background: #242424;
      padding: 7px 10px;
      border-radius: 6px;
      word-break: break-word;
    }
    .comment-row { display: flex; gap: 8px; }
    .comment-row input { margin-top: 0; flex: 1; }
    .comment-row button {
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-weight: 600;
      cursor: pointer;
    }
    textarea, input {
      width: 100%;
      background: #262626;
      border: 1px solid #3a3a3a;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      font-family: inherit;
    }
    .primary-btn {
      margin-top: 10px;
      background: #4caf50;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }
    .secondary-btn {
      margin-top: 8px;
      background: #283545;
      color: #d6e8ff;
      border: 1px solid #3d526b;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }
    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
      line-height: 1.4;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 10;
    }
    nav button {
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    nav button.active { color: #4caf50; }
  </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;">
  <header>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="logo">2friend</span>
      <span class="badge">480p · HLS · 128k</span>
    </div>
    <span id="headerUser" style="font-size:12px; color:#aaa;">@2friend_user</span>
  </header>

  <section id="storyStrip" class="stories"></section>

  <section id="storyViewer" class="story-viewer">
    <div class="story-viewer-top">
      <span id="storyViewerAuthor">स्टोरी प्रीव्यू</span>
      <button class="delete-btn" onclick="closeStoryViewer()">बंद करें</button>
    </div>
    <div id="storyViewerMedia" class="media-box" style="min-height:140px;"></div>
    <div id="storyViewerText" class="comment-item"></div>
  </section>

  <!-- Feed Tab -->
  <main id="tab-feed" class="tab-section active">
    <article class="card" data-post-id="official">
      <div class="card-header">
        <span>2friend Official</span>
        <span class="sub-tag">Bunny CDN · 480p HLS</span>
      </div>
      <div class="media-box">Short Video
