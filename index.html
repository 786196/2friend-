
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2friend</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;padding-bottom:65px}
header{padding:15px;background:#181818;position:sticky;top:0;z-index:5;border-bottom:1px solid #333}
header strong{font-size:23px;color:#2ecc71}
nav{position:fixed;bottom:0;width:100%;display:flex;background:#181818;border-top:1px solid #333;z-index:10}
nav button{flex:1;padding:16px 2px;background:none;color:#aaa;border:0}
nav button.active{color:#2ecc71}
.view{display:none}.view.active{display:block}
.card{margin:12px;padding:14px;background:#1c1c1c;border:1px solid #333;border-radius:12px}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#111;color:white;border:1px solid #444;border-radius:8px}
button{cursor:pointer}
.btn{background:#2ecc71;color:#000;border:0;padding:11px 15px;border-radius:8px;font-weight:bold}
.outline{background:#222;color:white;border:1px solid #555;padding:10px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:100px}
video{width:100%;max-height:65vh;background:#000;border-radius:9px}
.post{margin:12px;padding:12px;background:#1c1c1c;border-radius:12px}
.actions{display:flex;gap:20px;margin-top:12px}
.actions button{background:none;color:white;border:0}
.storybar{display:flex;gap:15px;padding:14px;overflow-x:auto}
.storyitem{text-align:center;min-width:65px}
.ring{width:58px;height:58px;border:2px solid #2ecc71;border-radius:50%;display:grid;place-items:center;margin:auto auto 5px}
#storyModal{display:none;position:fixed;inset:0;background:#080808;z-index:20;padding:15px;flex-direction:column;justify-content:space-between}
#storyModal.open{display:flex}
.muted{color:#aaa;font-size:13px}
.status{font-size:13px;color:#2ecc71;white-space:pre-wrap}
</style>
</head>
<body>

<header>
<strong>2friend</strong>
<span style="float:right">@2friend_user</span>
</header>

<section id="feedView" class="view active">
<div class="storybar" id="storyBar">
<div class="storyitem" onclick="switchTab('createView')">
<div class="ring">+</div>आपकी स्टोरी
</div>
</div>
<div id="feedList"></div>
</section>

<section id="storiesView" class="view">
<div class="card">
<h3>2friend Stories</h3>
<p class="muted">वीडियो स्टोरी अपने आप आगे बढ़ेगी।</p>
<div id="storiesList"></div>
</div>
</section>

<section id="createView" class="view">
<div class="card">
<h3>नई पोस्ट / स्टोरी</h3>
<div class="row">
<button class="btn" onclick="setKind('feed')">Feed Post</button>
<button class="outline" onclick="setKind('story')">Story</button>
</div>
<p id="kindLabel" class="muted">Feed Post चुना गया है</p>
<input id="author" maxlength="40" placeholder="आपका नाम">
<input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime">
<textarea id="caption" maxlength="1000" rows="3" placeholder="कुछ लिखें..."></textarea>
<button class="btn" id="uploadBtn" onclick="publish()">वीडियो अपलोड और पब्लिश करें</button>
<p id="uploadStatus" class="status"></p>
<progress id="uploadProgress" value="0" max="100" style="width:100%"></progress>
<p class="muted">अधिकतम 60 सेकंड। केवल वीडियो, फोटो नहीं।</p>
</div>
</section>

<section id="profileView" class="view">
<div class="card">
<h3>@2friend_user</h3>
<p>2friend पर आपका स्वागत है।</p>
<h4>केवल टेक्स्ट चैट</h4>
<div id="chatList"></div>
<div class="row">
<input id="chatInput" placeholder="मैसेज लिखें..." maxlength="1000">
<button class="btn" onclick="sendChat()">भेजें</button>
</div>
</div>
</section>

<div id="storyModal">
<div>
<div id="storyProgress" style="height:4px;background:#2ecc71;width:0%;margin-bottom:15px"></div>
<strong id="storyAuthor">Story</strong>
<button class="btn" style="float:right" onclick="closeStory()">बंद करें</button>
</div>
<div id="storyMedia"></div>
<p id="storyCaption"></p>
<div class="row">
<button class="outline" onclick="nextStory(-1)">पिछली</button>
<button class="btn" onclick="nextStory(1)">अगली →</button>
</div>
</div>

<nav>
<button class="active" onclick="switchTab('feedView',this)">Feed</button>
<button onclick="switchTab('storiesView',this)">Stories</button>
<button onclick="switchTab('createView',this)">Create +</button>
<button onclick="switchTab('profileView',this)">Profile</button>
</nav>

<script>
// ===== 2FRIEND CONFIGURATION =====

// अपना Cloudflare Worker URL यहाँ डालें
const UPLOAD_WORKER_URL = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";

// अपना असली Backend URL यहाँ डालें
const API_BASE_URL = "https://YOUR-API-DOMAIN.com";

// R2 Public Custom Domain
const R2_PUBLIC_URL = "https://YOUR-R2-PUBLIC-DOMAIN";

const MAX_VIDEO_SECONDS = 60;
let postKind = "feed";
let posts = [];
let stories = [];
let storyIndex = 0;
let storyTimer = null;
let currentStoryVideo = null;

function switchTab(id,btn){
 document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 if(id==="feedView")loadFeed();
 if(id==="storiesView")loadStories();
}

function setKind(kind){
 postKind=kind;
 document.getElementById("kindLabel").textContent=
 kind==="story"?"Story चुनी गई है":"Feed Post चुना गया है";
}

function status(message){
 document.getElementById("uploadStatus").textContent=message;
}

function validateVideo(file){
 return new Promise((resolve,reject)=>{
 if(!file)return reject(Error("पहले वीडियो चुनें।"));
 if(!file.type.startsWith("video/"))
 return reject(Error("केवल वीडियो फाइल मान्य है।"));
 const url=URL.createObjectURL(file);
 const v=document.createElement("video");
 v.preload="metadata";
 v.onloadedmetadata=()=>{
 const d=v.duration;
 URL.revokeObjectURL(url);
 if(!Number.isFinite(d)||d<=0)
 return reject(Error("वीडियो की अवधि नहीं पढ़ी जा सकी।"));
 if(d>MAX_VIDEO_SECONDS)
 return reject(Error("वीडियो 60 सेकंड से अधिक है।"));
 resolve(d);
 };
 v.onerror=()=>{
 URL.revokeObjectURL(url);
 reject(Error("वीडियो पढ़ने में समस्या है।"));
 };
 v.src=url;
 });
}

async function uploadToR2(file){
 const endpoint=UPLOAD_WORKER_URL.replace(/\/+$/,"")+"/upload";
 const response=await fetch(endpoint,{
 method:"POST",
 headers:{"Content-Type":file.type},
 body:file
 });
 if(!response.ok)throw Error("R2 अपलोड असफल: "+response.status);
 const result=await response.json();
 if(!result.success||!result.url)
 throw Error(result.error||"R2 URL नहीं मिला।");
 return result.url;
}

async function api(path,options={}){
 if(!API_BASE_URL||API_BASE_URL.includes("YOUR-API"))
 throw Error("Backend API URL अभी सेट नहीं है।");
 const response=await fetch(API_BASE_URL+path,{
 ...options,
 headers:{
 "Content-Type":"application/json",
 ...(options.headers||{})
 }
 });
 if(!response.ok)throw Error("Backend Error: "+response.status);
 return response.json();
}

async function publish(){
 const file=document.getElementById("videoFile").files[0];
 const caption=document.getElementById("caption").value.trim();
 const author=document.getElementById("author").value.trim()||"@2friend_user";
 const btn=document.getElementById("uploadBtn");
 const progress=document.getElementById("uploadProgress");

 if(btn.disabled)return;
 btn.disabled=true;
 progress.value=0;

 try{
 status("वीडियो की जाँच हो रही है...");
 const duration=await validateVideo(file);

 status("Cloudflare R2 पर वीडियो अपलोड हो रहा है...");
 progress.value=20;

 const mediaUrl=await uploadToR2(file);
 progress.value=75;

 status("पोस्ट Backend में सेव हो रही है...");

 const payload={
 author,
 caption,
 mediaUrl,
 durationSeconds:Math.ceil(duration)
 };

 const result=await api(
 postKind==="story"?"/api/stories":"/api/posts",
 {method:"POST",body:JSON.stringify(payload)}
 );

 progress.value=100;
 status("वीडियो सफलतापूर्वक अपलोड और सेव हो गया!");

 document.getElementById("videoFile").value="";
 document.getElementById("caption").value="";

 if(postKind==="story"){
 await loadStories();
 switchTab("storiesView");
 }else{
 await loadFeed();
 switchTab("feedView");
 }

 }catch(error){
 status("त्रुटि: "+error.message);
 }finally{
 btn.disabled=false;
 }
}

async function loadFeed(){
 try{
 const data=await api("/api/feed");
 posts=data.posts||[];
 renderFeed();
 }catch(e){
 document.getElementById("feedList").innerHTML=
 '<div class="card">Feed लोड नहीं हो सकी। Backend जाँचें।</div>';
 }
}

function renderFeed(){
 const list=document.getElementById("feedList");
 list.innerHTML="";
 posts.forEach(p=>{
 const card=document.createElement("article");
 card.className="post";
 const name=document.createElement("strong");
 name.textContent=p.author||"2friend User";
 const caption=document.createElement("p");
 caption.textContent=p.caption||"";
 card.append(name,caption);

 if(p.media_url){
 const v=document.createElement("video");
 v.src=p.media_url;
 v.controls=true;
 v.playsInline=true;
 v.preload="metadata";
 v.setAttribute("controlsList","nodownload noplaybackrate");
 card.appendChild(v);
 }

 const actions=document.createElement("div");
 actions.className="actions";
 const like=document.createElement("button");
 like.textContent="♥ Like";
 like.onclick=()=>likePost(p.id);
 const comment=document.createElement("button");
 comment.textContent="Comment";
 comment.onclick=()=>commentPost(p.id);
 actions.append(like,comment);
 card.appendChild(actions);
 list.appendChild(card);
 });
}

async function likePost(id){
 try{
 await api("/api/posts/"+encodeURIComponent(id)+"/like",{method:"POST"});
 await loadFeed();
 }catch(e){alert("Like सेव नहीं हुआ: "+e.message);}
}

async function commentPost(id){
 const message=prompt("अपना टेक्स्ट कमेंट लिखें");
 if(!message||!message.trim())return;
 try{
 await api("/api/posts/"+encodeURIComponent(id)+"/comments",{
 method:"POST",
 body:JSON.stringify({commentText:message.trim()})
 });
 await loadFeed();
 }catch(e){alert("कमेंट सेव नहीं हुआ: "+e.message);}
}

async function loadStories(){
 try{
 const data=await api("/api/stories");
 stories=data.stories||[];
 renderStories();
 }catch(e){
 document.getElementById("storiesList").textContent=
 "Stories लोड नहीं हो सकीं।";
 }
}

function renderStories(){
 const list=document.getElementById("storiesList");
 const bar=document.getElementById("storyBar");
 list.innerHTML="";
 bar.innerHTML="";
 stories.forEach((s,i)=>{
 const b=document.createElement("button");
 b.className="outline";
 b.textContent=s.author||"Story";
 b.onclick=()=>openStory(i);
 list.appendChild(b);

 const item=document.createElement("div");
 item.className="storyitem";
 const ring=document.createElement("div");
 ring.className="ring";
 ring.textContent="▶";
 const label=document.createElement("span");
 label.textContent=s.author||"Story";
 item.append(ring,label);
 item.onclick=()=>openStory(i);
 bar.appendChild(item);
 });
}

function openStory(i){
 if(!stories.length)return;
 storyIndex=i;
 document.getElementById("storyModal").classList.add("open");
 showStory();
}

function showStory(){
 clearInterval(storyTimer);
 if(currentStoryVideo){
 currentStoryVideo.pause();
 currentStoryVideo=null;
 }
 const s=stories[storyIndex];
 if(!s)return closeStory();

 document.getElementById("storyAuthor").textContent=s.author||"Story";
 document.getElementById("storyCaption").textContent=s.caption||"";
 const slot=document.getElementById("storyMedia");
 slot.innerHTML="";

 if(s.media_url){
 const v=document.createElement("video");
 v.src=s.media_url;
 v.controls=true;
 v.autoplay=true;
 v.playsInline=true;
 v.setAttribute("controlsList","nodownload noplaybackrate");
 slot.appendChild(v);
 currentStoryVideo=v;
 v.onended=()=>nextStory(1);
 }else{
 setTimeout(()=>nextStory(1),5000);
 }

 let start=Date.now();
 storyTimer=setInterval(()=>{
 const pct=Math.min(100,(Date.now()-start)/150);
 document.getElementById("storyProgress").style.width=pct+"%";
 if(pct>=100)nextStory(1);
 },150);
}

function nextStory(direction){
 clearInterval(storyTimer);
 storyIndex=(storyIndex+direction+stories.length)%stories.length;
 showStory();
}

function closeStory(){
 clearInterval(storyTimer);
 if(currentStoryVideo)currentStoryVideo.pause();
 currentStoryVideo=null;
 document.getElementById("storyModal").classList.remove("open");
}

async function sendChat(){
 const input=document.getElementById("chatInput");
 const message=input.value.trim();
 if(!message)return;
 try{
 await api("/api/messages",{
 method:"POST",
 body:JSON.stringify({
 senderHandle:"@2friend_user",
 messageText:message
 })
 });
 const li=document.createElement("p");
 li.textContent="आप: "+message;
 document.getElementById("chatList").appendChild(li);
 input.value="";
 }catch(e){alert("मैसेज नहीं भेजा गया: "+e.message);}
}

loadFeed();
loadStories();
</script>
</body>
</html>
