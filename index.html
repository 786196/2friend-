<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2friend</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #111; color: #fff; padding-bottom: 80px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #111; z-index: 20; gap: 8px; flex-wrap: wrap; }
    .brand-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-green { background: #163826; color: #2ecc71; border: 1px solid #2ecc71; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .badge-ad { background: #2c2210; color: #f1c40f; border: 1px solid #f1c40f; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .lang-select { background: #1a1a1a; color: #2ecc71; border: 1px solid #333; border-radius: 8px; padding: 5px 8px; font-size: 12px; font-weight: 600; }
    
    .stories { display: flex; gap: 14px; padding: 14px 16px; overflow-x: auto; border-bottom: 1px solid #222; background: #141414; }
    .story { text-align: center; font-size: 12px; cursor: pointer; min-width: 72px; }
    .ring { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #2ecc71; margin: 0 auto 6px; background: #1c1c1c; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #2ecc71; font-weight: 600; overflow: hidden; }
    
    .view { display: none; }
    .view.active { display: block; }
    .card { margin: 14px; background: #1a1a1a; border-radius: 12px; padding: 0 0 14px 0; border: 1px solid #2a2a2a; overflow: hidden; }
    .widget-card { margin: 14px; background: #1a1a1a; border-radius: 12px; padding: 16px; border: 1px solid #2a2a2a; }
    .ad-card { margin: 14px; background: #191712; border-radius: 12px; padding: 16px; border: 1px dashed #f1c40f; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; }
    .user-meta { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: #2ecc71; color: #000; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #1d2b44; color: #7fb3ff; font-weight: 600; }
    
    .preview { width: 100%; aspect-ratio: 4/4; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative; cursor: pointer; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
    img.post-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .actions-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 6px; }
    .actions-left { display: flex; gap: 18px; align-items: center; }
    .action-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 0; display: flex; align-items: center; }
    .action-btn.liked { color: #ff3040; }
    .likes-count { padding: 0 14px; font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .caption-area { padding: 0 14px; font-size: 13.5px; line-height: 1.45; color: #eee; }
    .caption-area strong { color: #fff; margin-right: 5px; }
    .hashtag { color: #7fb3ff; }
    .view-comments-btn { padding: 4px 14px 0; font-size: 13px; color: #999; cursor: pointer; display: block; }

    .comments { margin: 10px 14px 0; border-top: 1px solid #2a2a2a; padding-top: 10px; display: none; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; font-family: inherit; }
    .btn { padding: 10px 16px; border: none; border-radius: 8px; background: #2ecc71; color: #000; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-outline { padding: 10px 16px; border: 1px solid #444; border-radius: 8px; background: #1c1c1c; color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .comment-list { list-style: none; padding: 0; margin: 6px 0 0; font-size: 13px; color: #ddd; }
    .comment-list li { padding: 8px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* Fullscreen Reels Modal */
    .fullscreen-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; }
    .fullscreen-modal.open { display: flex; }
    .fullscreen-modal video { width: 100%; height: 100%; object-fit: cover; }
    .close-fs-btn { position: absolute; top: 18px; left: 16px; background: rgba(0,0,0,0.65); color: #fff; border: 1px solid #444; padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; z-index: 100001; }
    
    .reel-right-actions { position: absolute; right: 14px; bottom: 85px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 100001; }
    .reel-action-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .reel-action-item span.icon { font-size: 28px; }
    
    .reel-bottom-info { position: absolute; left: 14px; right: 75px; bottom: 28px; z-index: 100001; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    .reel-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .reel-follow-btn { border: 1px solid #fff; background: transparent; color: #fff; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #141414; border-top: 1px solid #222; z-index: 20; }
    nav button { flex: 1; padding: 14px 0; background: none; border: none; color: #aaa; font-size: 14px; cursor: pointer; }
    nav button.active { color: #2ecc71; font-weight: 600; }
  </style>
</head>
<body oncontextmenu="return false;">
  <header>
    <div class="brand-wrap">
      <strong style="font-size:18px;">2friend</strong>
      <span class="badge-green">Applooney Max (Main) + 4 Networks</span>
      <span class="tag">R2 Cache &gt; 99% · Zero Cost</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="hi">हिन्दी</option>
        <option value="en">English</option>
        <option value="bn">বাংলা</option>
        <option value="te">తెలుగు</option>
        <option value="mr">मराठी</option>
        <option value="ta">தமிழ்</option>
        <option value="ur">اردو</option>
        <option value="gu">ગુજરાતી</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="ml">മലയാളം</option>
        <option value="or">ଓଡ଼ିଆ</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
        <option value="as">অসমীয়া</option>
        <option value="mai">मैथिली</option>
      </select>
      <span style="font-size:13px; color:#ccc;">@2friend_user</span>
    </div>
  </header>

  <section id="feedView" class="view active">
    <div class="stories" id="topStoriesBar">
      <div class="story" onclick="openDirectStory(0)"><div class="ring">+</div>आपकी स्टोरी</div>
    </div>
    <div id="feedList"></div>
  </section>

  <section id="createView" class="view">
    <div class="widget-card">
      <div class="card-head" style="padding:0 0 8px 0;"><strong>नई पोस्ट / वीडियो जोड़ें</strong></div>
      <div style="margin-top:10px;"><input type="text" id="postTitle" placeholder="नाम (जैसे: @2friend_user)" /></div>
      <div style="margin-top:10px;"><input type="text" id="postMediaUrl" placeholder="वीडियो लिंक (.mp4 URL यहाँ डालें)" /></div>
      <div style="margin-top:10px;"><textarea id="postCaption" rows="3" placeholder="कैप्शन और हैशटैग लिखें (#2friend #delhi)..."></textarea></div>
      <div class="row" style="margin-top:12px;"><button class="btn" onclick="createPost()">पब्लिश करें</button></div>
      <p id="createStatus" style="margin:8px 0 0; font-size:12px; color:#2ecc71;"></p>
    </div>
  </section>

  <!-- Fullscreen Reels Player -->
  <div class="fullscreen-modal" id="fsVideoModal">
    <button class="close-fs-btn" onclick="closeFullscreenVideo()">← Reels</button>
    <div id="fsVideoContainer" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;"></div>
    <div class="reel-right-actions" id="fsRightActions"></div>
    <div class="reel-bottom-info" id="fsBottomInfo"></div>
  </div>

  <nav>
    <button class="active" onclick="switchTab(this, 'feedView')">Feed</button>
    <button onclick="switchTab(this, 'createView')">Create</button>
  </nav>

  <script>
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());

    function changeLanguage(lang) { document.documentElement.lang = lang; }

    function formatHashtags(text) {
      return text.replace(/(#[a-zA-Z0-9_\u0900-\u097F]+)/g, '<span class="hashtag">$1</span>');
    }

    const posts = [
      {
        id: 1,
        author: '2friend Official',
        subInfo: 'Original audio · Delhi',
        tag: '480p · Zero Cost',
        caption: '2friend पर बिना किसी खर्च के तेज़ 480p शॉर्ट वीडियो देखें! #2friend #virel #delhi',
        // एक सुनिश्चित चलने वाला फ्री सैंपल वीडियो लिंक उपयोग किया गया है ताकि स्क्रीन कभी काली न हो
        videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
        likes: 230,
        liked: false,
        comments: ['बहुत बढ़िया वीडियो है!']
      }
    ];

    function renderFeed() {
      const list = document.getElementById('feedList');
      if (!list) return;
      list.innerHTML = '';

      posts.forEach((post, index) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-head">
            <div class="user-meta">
              <div class="user-avatar">${post.author.charAt(0).toUpperCase()}</div>
              <div>
                <strong style="font-size:14px; display:block;">${post.author}</strong>
                <small style="color:#999; font-size:11px;">${post.subInfo}</small>
              </div>
            </div>
            <span class="tag">${post.tag}</span>
          </div>

          <div class="preview" onclick="openFullscreenVideo(${index})">
            <video id="feed-vid-${index}" autoplay muted loop playsinline preload="auto" src="${post.videoUrl}"></video>
            <div style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.7); padding:4px 8px; border-radius:6px; font-size:11px; color:#2ecc71;">▶ फुलस्क्रीन चलाएं</div>
          </div>

          <div class="actions-bar">
            <div class="actions-left">
              <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${index})">${post.liked ? '❤️' : '🤍'}</button>
              <button class="action-btn" onclick="toggleComments(${index})">💬</button>
              <button class="action-btn" onclick="alert('लिंक कॉपी हो गया!')">✈️</button>
            </div>
            <span style="font-size:11px; color:#777;">🔒 Secured</span>
          </div>

          <div class="likes-count">Liked by ${post.likes} users</div>
          <div class="caption-area"><strong>${post.author}</strong>${formatHashtags(post.caption)}</div>
          <span class="view-comments-btn" onclick="toggleComments(${index})">View all ${post.comments.length} comments</span>

          <div class="comments" id="comments-${index}">
            <ul class="comment-list">
              ${post.comments.map(c => `<li><span>${c}</span></li>`).join('')}
            </ul>
            <div class="row">
              <input type="text" id="input-${index}" placeholder="कमेंट लिखें..." />
              <button class="btn" onclick="addComment(${index})">भेजें</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleLike(i) {
      posts[i].liked = !posts[i].liked;
      posts[i].likes += posts[i].liked ? 1 : -1;
      renderFeed();
    }

    function toggleComments(i) {
      const el = document.getElementById(`comments-${i}`);
      if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function addComment(i) {
      const input = document.getElementById(`input-${i}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;
      posts[i].comments.push(val);
      renderFeed();
      document.getElementById(`comments-${i}`).style.display = 'block';
    }

    function openFullscreenVideo(postIndex) {
      const post = posts[postIndex];
      if (!post || !post.videoUrl) return;
      const modal = document.getElementById('fsVideoModal');
      const container = document.getElementById('fsVideoContainer');
      const rightActions = document.getElementById('fsRightActions');
      const bottomInfo = document.getElementById('fsBottomInfo');

      container.innerHTML = `<video id="fsActiveVid" autoplay loop playsinline controls controlsList="nodownload"></video>`;
      const fsVid = document.getElementById('fsActiveVid');
      fsVid.src = post.videoUrl;
      fsVid.play().catch(() => {});

      rightActions.innerHTML = `
        <div class="reel-action-item" onclick="toggleLike(${postIndex}); openFullscreenVideo(${postIndex});">
          <span class="icon">${post.liked ? '❤️' : '🤍'}</span>
          <span>${post.likes}</span>
        </div>
        <div class="reel-action-item" onclick="closeFullscreenVideo(); toggleComments(${postIndex});">
          <span class="icon">💬</span>
          <span>${post.comments.length}</span>
        </div>
        <div class="reel-action-item" onclick="alert('लिंक कॉपी हो गया!')">
          <span class="icon">✈️</span>
          <span>Share</span>
        </div>
      `;

      bottomInfo.innerHTML = `
        <div class="reel-user-row">
          <div class="user-avatar">${post.author.charAt(0).toUpperCase()}</div>
          <strong style="font-size:15px;">${post.author}</strong>
          <button class="reel-follow-btn">Follow</button>
        </div>
        <div style="font-size:13.5px; line-height:1.4;">${formatHashtags(post.caption)}</div>
      `;

      modal.classList.add('open');
    }

    function closeFullscreenVideo() {
      const modal = document.getElementById('fsVideoModal');
      const container = document.getElementById('fsVideoContainer');
      const fsVid = document.getElementById('fsActiveVid');
      if (fsVid) fsVid.pause();
      container.innerHTML = '';
      modal.classList.remove('open');
    }

    function createPost() {
      const author = document.getElementById('postTitle').value.trim() || '@2friend_user';
      const mediaUrl = document.getElementById('postMediaUrl').value.trim() || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4';
      const caption = document.getElementById('postCaption').value.trim() || 'नई पोस्ट #2friend';

      posts.unshift({
        id: Date.now(),
        author,
        subInfo: 'Just now · 2friend',
        tag: '480p',
        caption: caption,
        videoUrl: mediaUrl,
        likes: 1,
        liked: false,
        comments: []
      });

      document.getElementById('createStatus').textContent = 'वीडियो सफलतापूर्वक फीड में जुड़ गया और चालू है!';
      renderFeed();
      setTimeout(() => switchTab(document.querySelectorAll('nav button')[0], 'feedView'), 1000);
    }

    function switchTab(btn, viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    renderFeed();
  </script>
</body>
</html>
