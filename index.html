    function buildCacheSafeR2Url(base, rawPath) {
      if (!rawPath) return '';
      var cleanUrl = rawPath.split('?')[0].trim();
      if (/^https?:\/\//i.test(cleanUrl)) return cleanUrl;
      var cleanBase = (base || R2_CACHE_BASE).replace(/\/+$/, '');
      var cleanPath = cleanUrl.replace(/^\/+/, '');
      return cleanBase ? cleanBase + '/' + cleanPath : cleanPath;
    }

    function loadStorage(key, fallback) {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function saveStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_) {}
    }

    function normalizeHandle(raw) {
      var clean = String(raw || '').trim().replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_@]/g, '');
      if (!clean) return '@2friend_user';
      return clean.charAt(0) === '@' ? clean : '@' + clean;
    }

    // केवल 1 मिनट (60 सेकंड) की जाँच — किसी भी क्वालिटी/रिज़ॉल्यूशन का वीडियो मान्य
    function validateVideoFile(file) {
      return new Promise(function(resolve, reject) {
        var tempUrl = URL.createObjectURL(file);
        var probe = document.createElement('video');
        probe.preload = 'metadata';

        probe.onloadedmetadata = function() {
          var duration = probe.duration;
          URL.revokeObjectURL(tempUrl);

          if (!isFinite(duration) || duration <= 0) {
            reject(new Error('वीडियो की अवधि नहीं पढ़ी जा सकी।'));
            return;
          }
          if (duration > MAX_VIDEO_SECONDS) {
            reject(new Error('केवल 1 मिनट (60 सेकंड) या उससे छोटा वीडियो मान्य है (' + Math.ceil(duration) + ' सेकंड का वीडियो नहीं चलेगा)।'));
            return;
          }
          resolve({ duration: duration });
        };

        probe.onerror = function() {
          URL.revokeObjectURL(tempUrl);
          reject(new Error('वीडियो फ़ाइल पढ़ी नहीं जा सकी।'));
        };

        probe.src = tempUrl;
      });
    }

      posts.splice(i, 1);

      renderFeed();

    function toggleLike(i) {
      posts[i].liked = !posts[i].liked;
      posts[i].likes += posts[i].liked ? 1 : -1;
      saveStorage(STORAGE_KEYS.posts, posts);
      renderFeed();
    }

    function toggleComments(i) {
      var el = document.getElementById('comments-' + i);
      if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';

    function showCurrentStory() {
      clearInterval(storyTimer);
      progressVal = 0;
      var item = storyItems[currentStoryIdx] || storyItems[0];

      document.getElementById('storyUser').textContent = item.isAd
        ? 'Gaming Ad · ' + (item.adNetwork || PRIMARY_AD_NETWORK)

      document.getElementById('storyText').textContent = item.text;

      var badge = document.getElementById('storyAdBadge');

      mediaSlot.innerHTML = item.videoUrl

        : '';

      var fill = document.getElementById('storyProgress');
      fill.style.width = '0%';

      var storyVid = mediaSlot.querySelector('video');
      if (storyVid) {
        storyVid.muted = false;
        storyVid.volume = 1.0;
        document.getElementById('storySub').textContent = 'वीडियो स्टोरी चल रही है (Max 1m · Any Quality)';
        storyVid.play().catch(function() {});

        storyTimer = setInterval(function() {
          if (storyVid.duration && isFinite(storyVid.duration)) {
            progressVal = Math.min(100, (storyVid.currentTime / storyVid.duration) * 100);
            fill.style.width = progressVal + '%';

        }, 200);

        storyVid.onended = function() { nextStoryStep(); };
        return;

      document.getElementById('storySub').textContent = item.isAd

      document.getElementById('storyBox').style.borderColor = item.isAd ? '#f1c40f' : '#2a2a2a';

      storyTimer = setInterval(function() {
        progressVal += 4;
        fill.style.width = progressVal + '%';
        if (progressVal >= 100) {
          nextStoryStep();
        }
      }, 200);
    }

    function nextStoryStep() {
      currentStoryIdx = (currentStoryIdx + 1) % storyItems.length;

      if (feedBtn && storyBtn) {
        feedBtn.className = kind === 'feed' ? 'btn' : 'btn-outline';
        storyBtn.className = kind === 'story' ? 'btn' : 'btn-outline';
      }
    }

    function createPost() {
      var kind = document.getElementById('postKind').value;
      var rawTitle = document.getElementById('postTitle').value.trim();
      var author = rawTitle ? normalizeHandle(rawTitle) : currentUserHandle;
      var language = document.getElementById('postLanguage').value || 'hi';
      var musicTrack = document.getElementById('postMusicTrack').value || '2friend Beat 01 (Copyright-Free)';
      var r2Base = document.getElementById('r2BaseInput').value.trim() || R2_CACHE_BASE;
      var rawMedia = document.getElementById('postMediaUrl').value.trim();
      var fileInput = document.getElementById('postVideoFile');
      var selectedFile = fileInput && fileInput.files ? fileInput.files[0] : null;
      var rawCaption = document.getElementById('postCaption').value.trim() || '2friend वीडियो';
      var caption = rawCaption + ' [' + language.toUpperCase() + ' • ' + musicTrack + ']';
      var status = document.getElementById('createStatus');

      function finishCreate(localVideoUrl, durationSec) {
        var r2MediaUrl = buildCacheSafeR2Url(r2Base, rawMedia);
        var mediaUrl = localVideoUrl || r2MediaUrl;

        if (kind === 'story') {
          storyItems.splice(1, 0, {
            user: author,
            text: caption,
            isAd: false,
            adNetwork: PRIMARY_AD_NETWORK,
            videoUrl: mediaUrl
          });
          saveStorage(STORAGE_KEYS.stories, storyItems);
          renderStoriesHub();

          if (fileInput) fileInput.value = '';
          document.getElementById('postTitle').value = '';
          document.getElementById('postMediaUrl').value = '';
          document.getElementById('postCaption').value = '';
          status.textContent = 'नई वीडियो स्टोरी फ़ोन में सेव हो गई है — Stories खुल रही है...';

          var storiesBtn = document.querySelectorAll('nav button')[1];
          if (storiesBtn) switchTab(storiesBtn, 'storiesView');
          openDirectStory(1);
          return;
        }

        posts.unshift({
          id: Date.now(),
          author: author,
          tag: 'Cloudflare R2 · Max 1m · ' + language.toUpperCase(),
          caption: caption + ' (Max 1 min · Any Quality)',
          videoUrl: mediaUrl,
          likes: 0,
          liked: false,
          comments: []
        });
        saveStorage(STORAGE_KEYS.posts, posts);

        if (fileInput) fileInput.value = '';
        document.getElementById('postTitle').value = '';
        document.getElementById('postMediaUrl').value = '';
        document.getElementById('postCaption').value = '';
        status.textContent = 'वीडियो फ़ोन में सेव होकर Feed में जुड़ गई है।';

        renderFeed();
        switchTab(document.querySelector('nav button'), 'feedView');
      }

      if (selectedFile) {
        validateVideoFile(selectedFile).then(function(meta) {
          var durationSec = Math.round(meta.duration);
          var localVideoUrl = URL.createObjectURL(selectedFile);
          status.textContent = 'वीडियो मान्य है (' + durationSec + 's / Max 60s)।';
          finishCreate(localVideoUrl, durationSec);
        }).catch(function(err) {
          status.textContent = err.message;
          if (fileInput) fileInput.value = '';
        });
        return;
      }

      finishCreate('', 0);
    }

    var defaultMessages = [
      '2friend: स्वागत है! यहाँ केवल टेक्स्ट मैसेज सक्रिय है।'
    ];
    var savedMessages = loadStorage(STORAGE_KEYS.messages, defaultMessages);

    function renderChat() {
      var list = document.getElementById('chatList');
      if (!list) return;
      list.innerHTML = savedMessages.map(function(m) {
        return '<li><span>' + m + '</span></li>';
      }).join('');
    }

    function sendChat() {
      var input = document.getElementById('chatInput');
      var msg = input.value.trim();
      if (!msg) return;
      savedMessages.push(currentUserHandle + ': ' + msg);
      saveStorage(STORAGE_KEYS.messages, savedMessages);
      renderChat();
      input.value = '';
    }

    function sharePost() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).catch(function() {});
      }
      alert('2friend लिंक तैयार है।');
    }

    function switchTab(btn, viewId) {
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      var target = document.getElementById(viewId);
      if (target) target.classList.add('active');
      document.querySelectorAll('nav button').forEach(function(b) { b.classList.remove('active'); });
      if (btn) btn.classList.add('active');
    }

    var defaultScreenUsers = [
      { handle: currentUserHandle, minutes: 14 },
      { handle: '@friend_one', minutes: 11 },
      { handle: '@friend_two', minutes: 7 }
    ];
    var screenUsers = loadStorage(STORAGE_KEYS.screenUsers, defaultScreenUsers);

    function renderWinners() {
      var list = document.getElementById('winnerRankList');
      if (!list) return;
      if (screenUsers[0]) {
        screenUsers[0].handle = currentUserHandle;
      }
      var sorted = screenUsers.slice().sort(function(a, b) { return b.minutes - a.minutes; });
      list.innerHTML = sorted.map(function(u, idx) {
        return '<li><span>#' + (idx + 1) + ' ' + u.handle + ' — ' + u.minutes + ' min</span></li>';
      }).join('');
      var currentUser = screenUsers.find(function(u) { return u.handle === currentUserHandle; }) || sorted[0];
      var profileTime = document.getElementById('profileScreenTime');
      if (profileTime && currentUser) profileTime.textContent = currentUser.minutes + ' min';
    }

    function simulateScreenTime() {
      screenUsers[0].minutes += 1;
      saveStorage(STORAGE_KEYS.screenUsers, screenUsers);
      renderWinners();
    }

    function processMidnightPayout() {
      var status = document.getElementById('payoutStatus');
      var rewardState = document.getElementById('profileRewardState');
      var sorted = screenUsers.slice().sort(function(a, b) { return b.minutes - a.minutes; });
      var top = sorted[0];
      if (status && top) {
        status.textContent = 'रात 12:00 AM प्रोसेस पूरा: टॉप विनर ' + top.handle + ' (' + top.minutes + ' min)';
      }
      if (rewardState && top) {
        rewardState.textContent = 'Winner: ' + top.handle;
      }
    }

    mountHandleEditor();
    mountLanguageSwitcher();
    syncHandleUI();
    applyLanguageUI(loadStorage(STORAGE_KEYS.uiLang, 'hi'));
    renderFeed();
    renderStoriesHub();
    renderChat();
    renderWinners();
  </script>
